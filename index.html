<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown 17:00</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 30%, #30234f 0%, #100d18 42%, #030305 100%);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
    pointer-events: none;
}

.glow.one {
    background: #7c3aed;
    top: -120px;
    left: -100px;
}

.glow.two {
    background: #2563eb;
    right: -100px;
    bottom: -100px;
}

.card {
    width: 95%;
    max-width: 760px;
    padding: 42px 15px 48px;
    text-align: center;

    background: rgba(15, 13, 23, .72);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 32px;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow: 0 30px 100px rgba(0,0,0,.6);
}

.label {
    font-size: 12px;
    letter-spacing: 5px;
    opacity: .5;
    margin-bottom: 12px;
}

h1 {
    margin: 0 0 35px;
    font-size: clamp(28px, 7vw, 52px);
}

.timer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(3px, 2vw, 16px);
    font-variant-numeric: tabular-nums;
}

.unit {
    min-width: 0;
}

.digit {
    display: inline-block;
    font-size: clamp(60px, 18vw, 150px);
    line-height: .9;
    font-weight: 800;
    letter-spacing: -6px;
    text-shadow: 0 0 35px rgba(255,255,255,.2);
}

.separator {
    font-size: clamp(50px, 13vw, 105px);
    font-weight: 300;
    opacity: .45;
}

.caption {
    margin-top: 14px;
    font-size: 9px;
    letter-spacing: 3px;
    opacity: .35;
}

.tick {
    animation: tick .35s cubic-bezier(.2,.9,.25,1.3);
}

@keyframes tick {
    0% {
        transform: scale(1.2);
        opacity: .3;
    }

    55% {
        transform: scale(.96);
        opacity: 1;
    }

    100% {
        transform: scale(1);
    }
}

.progress {
    width: 82%;
    max-width: 520px;
    height: 4px;
    margin: 42px auto 0;

    background: rgba(255,255,255,.08);
    border-radius: 10px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;

    background: linear-gradient(
        90deg,
        #8b5cf6,
        #38bdf8
    );

    box-shadow: 0 0 20px #8b5cf6;
}

.status {
    margin-top: 18px;
    font-size: 12px;
    opacity: .4;
}

.finished {
    font-size: clamp(45px, 12vw, 90px);
    font-weight: 800;

    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.05);
        text-shadow: 0 0 50px #8b5cf6;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="card">

    <div class="label">COUNTDOWN</div>

    <h1>Până la ora 17:00</h1>

    <div id="timer" class="timer">

        <div class="unit">
            <span id="hours" class="digit">00</span>
            <div class="caption">ORE</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <span id="minutes" class="digit">00</span>
            <div class="caption">MINUTE</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <span id="seconds" class="digit">00</span>
            <div class="caption">SECUNDE</div>
        </div>

    </div>

    <div class="progress">
        <div id="bar" class="bar"></div>
    </div>

    <div id="status" class="status">
        Sincronizat cu ora telefonului
    </div>

</div>

<script>

function animateNumber(element, value) {

    if (element.textContent !== value) {

        element.textContent = value;

        element.classList.remove("tick");

        void element.offsetWidth;

        element.classList.add("tick");
    }
}


function updateCountdown() {

    const now = new Date();

    const target = new Date();

    target.setHours(17, 0, 0, 0);

    const difference =
        target.getTime() - now.getTime();


    if (difference <= 0) {

        document.getElementById("timer").innerHTML =
            '<div class="finished">17:00 🎉</div>';

        document.getElementById("status").textContent =
            "A sosit ora 17:00!";

        document.getElementById("bar").style.width =
            "100%";

        return;
    }


    const totalSeconds =
        Math.floor(difference / 1000);


    const hours =
        Math.floor(totalSeconds / 3600);


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    animateNumber(
        document.getElementById("hours"),
        String(hours).padStart(2, "0")
    );


    animateNumber(
        document.getElementById("minutes"),
        String(minutes).padStart(2, "0")
    );


    animateNumber(
        document.getElementById("seconds"),
        String(seconds).padStart(2, "0")
    );


    const start = new Date();

    start.setHours(0, 0, 0, 0);


    const totalDayTime =
        17 * 60 * 60 * 1000;


    const elapsed =
        now.getTime() - start.getTime();


    const percentage =
        Math.min(
            100,
            Math.max(
                0,
                elapsed / totalDayTime * 100
            )
        );


    document.getElementById("bar").style.width =
        percentage + "%";
}


updateCountdown();

setInterval(updateCountdown, 250);

</script>

</body>
</html>
