```html
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown 17:00</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 30%,
            #30234f 0%,
            #100d18 45%,
            #030305 100%
        );

}


/* =========================
   LUMINI DE FUNDAL
========================= */

.glow {

    position: fixed;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .28;

    pointer-events: none;

}

.glow.one {

    background: #7c3aed;

    top: -140px;
    left: -100px;

}

.glow.two {

    background: #2563eb;

    right: -120px;
    bottom: -100px;

}


/* =========================
   FARFURII + LINGURI
========================= */

.background-items {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1;

    overflow: hidden;

}


/* farfurii */

.plate {

    position: absolute;

    width: 110px;
    height: 110px;

    border-radius: 50%;

    border: 4px solid rgba(255,255,255,.10);

    box-shadow:
        inset 0 0 0 12px rgba(255,255,255,.025),
        0 0 30px rgba(255,255,255,.04);

    opacity: .55;

}

.plate::after {

    content: "";

    position: absolute;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.08);

    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%);

}


/* poziții farfurii */

.plate.p1 {

    left: 4%;
    top: 13%;

    transform: rotate(-12deg);

}

.plate.p2 {

    right: 5%;
    top: 18%;

    transform: rotate(17deg);

}

.plate.p3 {

    left: 7%;
    bottom: 10%;

    transform: rotate(9deg);

}

.plate.p4 {

    right: 8%;
    bottom: 9%;

    transform: rotate(-15deg);

}


/* linguri */

.spoon {

    position: absolute;

    width: 18px;
    height: 125px;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.13),
            transparent
        );

    opacity: .5;

}

.spoon::before {

    content: "";

    position: absolute;

    width: 43px;
    height: 52px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 40% 35%,
            rgba(255,255,255,.16),
            rgba(255,255,255,.035)
        );

    left: 50%;

    transform: translateX(-50%);

    top: -43px;

}


/* poziții linguri */

.spoon.s1 {

    left: 20%;
    top: 5%;

    transform: rotate(-24deg);

}

.spoon.s2 {

    right: 20%;
    top: 4%;

    transform: rotate(25deg);

}

.spoon.s3 {

    left: 23%;
    bottom: 4%;

    transform: rotate(18deg);

}

.spoon.s4 {

    right: 22%;
    bottom: 5%;

    transform: rotate(-20deg);

}


/* =========================
   NINSOARE
========================= */

.snow {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 5;

    overflow: hidden;

}

.snowflake {

    position: absolute;

    top: -20px;

    color: white;

    opacity: .75;

    user-select: none;

    animation-name: snowfall;

    animation-timing-function: linear;

    animation-iteration-count: infinite;

    text-shadow:
        0 0 6px rgba(255,255,255,.5);

}

@keyframes snowfall {

    0% {

        transform:
            translate3d(0,-30px,0)
            rotate(0deg);

        opacity: 0;

    }

    10% {

        opacity: .8;

    }

    50% {

        transform:
            translate3d(45px,50vh,0)
            rotate(180deg);

    }

    100% {

        transform:
            translate3d(-35px,110vh,0)
            rotate(360deg);

        opacity: .15;

    }

}


/* =========================
   CARD COUNTDOWN
========================= */

.card {

    position: relative;

    z-index: 10;

    width: 95%;
    max-width: 760px;

    padding: 42px 15px 48px;

    text-align: center;

    background:
        rgba(15,13,23,.72);

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 32px;

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6);

}


/* =========================
   TITLU
========================= */

.label {

    font-size: 12px;

    letter-spacing: 5px;

    opacity: .5;

    margin-bottom: 12px;

}

h1 {

    margin: 0 0 35px;

    font-size:
        clamp(28px,7vw,52px);

}


/* =========================
   TIMER
========================= */

.timer {

    display: flex;

    align-items: center;

    justify-content: center;

    gap:
        clamp(3px,2vw,16px);

    font-variant-numeric:
        tabular-nums;

}

.unit {

    min-width: 0;

}

.digit {

    display: inline-block;

    font-size:
        clamp(60px,18vw,150px);

    line-height: .9;

    font-weight: 800;

    letter-spacing: -6px;

    text-shadow:
        0 0 35px rgba(255,255,255,.2);

}

.separator {

    font-size:
        clamp(50px,13vw,105px);

    font-weight: 300;

    opacity: .45;

}

.caption {

    margin-top: 14px;

    font-size: 9px;

    letter-spacing: 3px;

    opacity: .35;

}


/* animație cifre */

.tick {

    animation:
        tick .35s
        cubic-bezier(.2,.9,.25,1.3);

}

@keyframes tick {

    0% {

        transform: scale(1.2);

        opacity: .3;

    }

    55% {

        transform: scale(.96);

        opacity: 1;

    }

    100% {

        transform: scale(1);

    }

}


/* =========================
   PROGRESS BAR
========================= */

.progress {

    width: 82%;

    max-width: 520px;

    height: 4px;

    margin:
        42px auto 0;

    background:
        rgba(255,255,255,.08);

    border-radius: 10px;

    overflow: hidden;

}

.bar {

    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            #8b5cf6,
            #38bdf8
        );

    box-shadow:
        0 0 20px #8b5cf6;

}


/* status */

.status {

    margin-top: 18px;

    font-size: 12px;

    opacity: .4;

}


/* =========================
   FINISH
========================= */

.finished {

    font-size:
        clamp(45px,12vw,90px);

    font-weight: 800;

    animation:
        pulse 1s infinite alternate;

}

@keyframes pulse {

    from {

        transform: scale(1);

    }

    to {

        transform: scale(1.05);

        text-shadow:
            0 0 50px #8b5cf6;

    }

}

</style>

</head>


<body>


<!-- LUMINI -->

<div class="glow one"></div>

<div class="glow two"></div>


<!-- FARFURII + LINGURI -->

<div class="background-items">

    <div class="plate p1"></div>

    <div class="plate p2"></div>

    <div class="plate p3"></div>

    <div class="plate p4"></div>


    <div class="spoon s1"></div>

    <div class="spoon s2"></div>

    <div class="spoon s3"></div>

    <div class="spoon s4"></div>

</div>


<!-- NINSOARE -->

<div id="snow" class="snow"></div>


<!-- COUNTDOWN -->

<div class="card">

    <div class="label">
        COUNTDOWN
    </div>


    <h1>
        Până la ora 17:00
    </h1>


    <div id="timer" class="timer">


        <div class="unit">

            <span
                id="hours"
                class="digit">
                00
            </span>

            <div class="caption">
                ORE
            </div>

        </div>


        <div class="separator">
            :
        </div>


        <div class="unit">

            <span
                id="minutes"
                class="digit">
                00
            </span>

            <div class="caption">
                MINUTE
            </div>

        </div>


        <div class="separator">
            :
        </div>


        <div class="unit">

            <span
                id="seconds"
                class="digit">
                00
            </span>

            <div class="caption">
                SECUNDE
            </div>

        </div>


    </div>


    <div class="progress">

        <div
            id="bar"
            class="bar">
        </div>

    </div>


    <div
        id="status"
        class="status">

        Sincronizat cu ora telefonului

    </div>

</div>


<script>


/* =========================
   COUNTDOWN
========================= */

function animateNumber(element, value) {

    if (
        element.textContent !== value
    ) {

        element.textContent = value;

        element.classList.remove("tick");

        void element.offsetWidth;

        element.classList.add("tick");

    }

}


function updateCountdown() {

    const now =
        new Date();


    const target =
        new Date();


    target.setHours(
        17,
        0,
        0,
        0
    );


    const difference =
        target.getTime()
        -
        now.getTime();


    if (
        difference <= 0
    ) {

        document
            .getElementById("timer")
            .innerHTML =
            '<div class="finished">17:00 🎉</div>';


        document
            .getElementById("status")
            .textContent =
            "A sosit ora 17:00!";


        document
            .getElementById("bar")
            .style.width =
            "100%";


        return;

    }


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600)
            / 60
        );


    const seconds =
        totalSeconds % 60;


    animateNumber(
        document.getElementById("hours"),
        String(hours)
            .padStart(2,"0")
    );


    animateNumber(
        document.getElementById("minutes"),
        String(minutes)
            .padStart(2,"0")
    );


    animateNumber(
        document.getElementById("seconds"),
        String(seconds)
            .padStart(2,"0")
    );


    const start =
        new Date();


    start.setHours(
        0,
        0,
        0,
        0
    );


    const totalDayTime =
        17 *
        60 *
        60 *
        1000;


    const elapsed =
        now.getTime()
        -
        start.getTime();


    const percentage =
        Math.min(
            100,
            Math.max(
                0,
                elapsed /
                totalDayTime *
                100
            )
        );


    document
        .getElementById("bar")
        .style.width =
        percentage + "%";

}


updateCountdown();


setInterval(
    updateCountdown,
    250
);


/* =========================
   GENERARE NINSOARE
========================= */

const snowContainer =
    document.getElementById("snow");


const snowCharacters =
    ["❄","❅","❆","•"];


for (
    let i = 0;
    i < 70;
    i++
) {

    const snowflake =
        document.createElement("div");


    snowflake.className =
        "snowflake";


    snowflake.textContent =
        snowCharacters[
            Math.floor(
                Math.random()
                *
                snowCharacters.length
            )
        ];


    snowflake.style.left =
        Math.random() * 100
        + "%";


    snowflake.style.fontSize =
        (Math.random() * 12 + 5)
        + "px";


    snowflake.style.animationDuration =
        (Math.random() * 7 + 5)
        + "s";


    snowflake.style.animationDelay =
        -(Math.random() * 12)
        + "s";


    snowflake.style.opacity =
        Math.random() * .6 + .2;


    snowContainer.appendChild(
        snowflake
    );

}


</script>


</body>
</html>
```
