<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dota 2 Countdown</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#30234f,#100d18 45%,#030305);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}.one{background:#7c3aed;top:-150px;left:-110px}.two{background:#2563eb;right:-130px;bottom:-110px}
.heroes{position:fixed;inset:0;z-index:1;pointer-events:none}
.hero{position:absolute;height:min(72vh,610px);width:auto;object-fit:contain;opacity:.88;filter:drop-shadow(0 0 24px rgba(255,255,255,.12));animation:float 5s ease-in-out infinite alternate}
.axe{left:0;bottom:-18px;transform:translateX(-3%)}.ember{right:0;bottom:-18px;transform:translateX(3%);animation-delay:-2.5s}
@keyframes float{to{margin-top:-10px}}
.background-items{position:fixed;inset:0;z-index:2;pointer-events:none}
.plate{position:absolute;width:150px;height:150px;border-radius:50%;border:5px solid rgba(255,255,255,.2);box-shadow:inset 0 0 0 16px rgba(255,255,255,.055),0 0 35px rgba(255,255,255,.07);opacity:.85}
.plate:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.14);top:50%;left:50%;transform:translate(-50%,-50%)}
.p1{left:2%;top:12%;transform:rotate(-12deg)}.p2{right:2%;top:12%;transform:rotate(12deg)}.p3{left:4%;bottom:6%;transform:rotate(9deg)}.p4{right:4%;bottom:6%;transform:rotate(-9deg)}
.spoon{position:absolute;width:22px;height:150px;border-radius:15px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);opacity:.85}
.spoon:before{content:"";position:absolute;width:54px;height:65px;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,rgba(255,255,255,.24),rgba(255,255,255,.05));left:50%;transform:translateX(-50%);top:-54px}
.s1{left:15%;top:4%;transform:rotate(-25deg)}.s2{right:15%;top:4%;transform:rotate(25deg)}.s3{left:16%;bottom:4%;transform:rotate(20deg)}.s4{right:16%;bottom:4%;transform:rotate(-20deg)}
.snow{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}.snowflake{position:absolute;top:-25px;color:#fff;text-shadow:0 0 7px rgba(255,255,255,.65);animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translate3d(0,-30px,0) rotate(0);opacity:0}10%{opacity:.8}50%{transform:translate3d(45px,50vh,0) rotate(180deg)}100%{transform:translate3d(-35px,110vh,0) rotate(360deg);opacity:.12}}
.card{position:relative;z-index:10;width:95%;max-width:760px;padding:42px 15px 48px;text-align:center;background:rgba(10,9,17,.78);border:1px solid rgba(255,255,255,.15);border-radius:32px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 100px rgba(0,0,0,.65)}
.label{font-size:12px;letter-spacing:5px;opacity:.55;margin-bottom:12px}h1{margin:0 0 35px;font-size:clamp(28px,7vw,52px)}
.timer{display:flex;align-items:center;justify-content:center;gap:clamp(3px,2vw,16px);font-variant-numeric:tabular-nums}.digit{display:inline-block;font-size:clamp(60px,18vw,150px);line-height:.9;font-weight:800;letter-spacing:-6px;text-shadow:0 0 35px rgba(255,255,255,.2)}.separator{font-size:clamp(50px,13vw,105px);font-weight:300;opacity:.45}.caption{margin-top:14px;font-size:9px;letter-spacing:3px;opacity:.4}.tick{animation:tick .35s cubic-bezier(.2,.9,.25,1.3)}
@keyframes tick{0%{transform:scale(1.2);opacity:.3}55%{transform:scale(.96);opacity:1}100%{transform:scale(1)}}
.progress{width:82%;max-width:520px;height:4px;margin:42px auto 0;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#38bdf8);box-shadow:0 0 20px #8b5cf6}.status{margin-top:18px;font-size:12px;opacity:.4}.finished{font-size:clamp(45px,12vw,90px);font-weight:800;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.05);text-shadow:0 0 50px #8b5cf6}}
@media(max-width:700px){.hero{height:42vh;opacity:.62}.axe{left:-8%;bottom:2%}.ember{right:-8%;bottom:2%}.plate{width:95px;height:95px;border-width:3px}.plate:after{width:48px;height:48px}.spoon{height:100px;width:15px}.spoon:before{width:38px;height:46px;top:-38px}.card{padding:32px 10px 38px}}
</style>
</head>
<body>
<div class="glow one"></div><div class="glow two"></div>
<div class="heroes"><img src="heroes/axe.png" class="hero axe"><img src="heroes/ember.png" class="hero ember"></div>
<div class="background-items"><div class="plate p1"></div><div class="plate p2"></div><div class="plate p3"></div><div class="plate p4"></div><div class="spoon s1"></div><div class="spoon s2"></div><div class="spoon s3"></div><div class="spoon s4"></div></div>
<div id="snow" class="snow"></div>
<main class="card"><div class="label">DOTA 2 • COUNTDOWN</div><h1>Până la ora 17:00</h1>
<div id="timer" class="timer"><div><span id="hours" class="digit">00</span><div class="caption">ORE</div></div><div class="separator">:</div><div><span id="minutes" class="digit">00</span><div class="caption">MINUTE</div></div><div class="separator">:</div><div><span id="seconds" class="digit">00</span><div class="caption">SECUNDE</div></div></div>
<div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="status">Sincronizat cu ora telefonului</div></main>
<script>
function anim(id,v){const e=document.getElementById(id);if(e.textContent!==v){e.textContent=v;e.classList.remove("tick");void e.offsetWidth;e.classList.add("tick")}}
function update(){const n=new Date(),t=new Date();t.setHours(17,0,0,0);let d=t-n;if(d<=0){document.getElementById("timer").innerHTML='<div class="finished">17:00 🎉</div>';document.getElementById("status").textContent="A sosit ora 17:00!";document.getElementById("bar").style.width="100%";return}let x=Math.floor(d/1000);anim("hours",String(Math.floor(x/3600)).padStart(2,"0"));anim("minutes",String(Math.floor(x%3600/60)).padStart(2,"0"));anim("seconds",String(x%60).padStart(2,"0"));let s=new Date();s.setHours(0,0,0,0);document.getElementById("bar").style.width=Math.min(100,Math.max(0,(n-s)/(17*3600000)*100))+"%"}update();setInterval(update,250);
const snow=document.getElementById("snow"),chars=["❄","❅","❆","•"];for(let i=0;i<70;i++){let s=document.createElement("div");s.className="snowflake";s.textContent=chars[Math.floor(Math.random()*chars.length)];s.style.left=Math.random()*100+"%";s.style.fontSize=Math.random()*12+5+"px";s.style.animationDuration=Math.random()*7+5+"s";s.style.animationDelay=-(Math.random()*12)+"s";snow.appendChild(s)}
</script>
</body></html>
